<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>theLatticeTree — Garden</title>
  <meta name="description" content="theLatticeTree is the Garden. Play is this canvas. Art listens at music.html. AUTONOMY is the root.">
  <meta property="og:title" content="theLatticeTree — Garden">
  <meta property="og:description" content="One Garden. Play is this canvas. Humans stay free. AUTONOMY is the root.">
  <meta property="og:type" content="website">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0a1a;
      --surface: #12101f;
      --border: rgba(200, 210, 230, 0.08);
      --text: rgba(200, 210, 230, 0.75);
      --muted: rgba(200, 210, 230, 0.35);
      --gold: #e8b019;
      --emerald: #34d399;
      --lavender: #a78bfa;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, 'Times New Roman', serif;
      overflow: hidden;
    }

    /* Mobile: keep the current Garden frame (44px chrome). Do not restyle the phone look. */
    #garden-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      background: rgba(12, 10, 26, 0.92);
      border-bottom: 1px solid var(--border);
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    #garden-header h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 0.9rem;
      font-weight: normal;
      color: var(--gold);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    #garden-header nav {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.75rem;
    }

    #garden-header nav a,
    #garden-header nav summary {
      color: var(--muted);
      text-decoration: none;
      cursor: pointer;
      list-style: none;
      font-family: Georgia, 'Times New Roman', serif;
    }

    #garden-header nav summary::-webkit-details-marker { display: none; }
    #garden-header nav a:hover,
    #garden-header nav summary:hover { color: var(--lavender); }

    .galaxies { position: relative; }

    .galaxies-panel {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      min-width: 148px;
      padding: 10px 12px;
      background: rgba(12, 10, 26, 0.96);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 12;
    }

    .galaxies-panel .verb {
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--lavender);
    }

    .galaxies-panel .name { color: var(--gold); }
    .galaxies-panel .later { color: var(--muted); opacity: 0.72; }
    .galaxies-panel .here { color: var(--emerald); }
    .galaxies-panel a { color: var(--gold); text-decoration: none; }
    .galaxies-panel a.quiet-root {
      color: var(--muted);
      font-size: 0.62rem;
      letter-spacing: 0.06em;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .galaxies-panel a.quiet-root:hover { color: var(--lavender); }

    #gardenContainer {
      position: fixed;
      top: 44px;
      left: 0; right: 0; bottom: 44px;
      overflow: hidden;
    }

    #gardenContainer canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .garden-evolution-indicator {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    .evo-luminos {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      color: var(--text);
      background: rgba(12, 10, 26, 0.72);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
    }

    .evo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .evo-name { color: var(--gold); }
    .evo-stage { color: var(--muted); }
    .evo-archetype { color: var(--lavender); font-size: 0.68rem; }

    .evo-bar {
      width: 48px;
      height: 3px;
      background: rgba(200, 210, 230, 0.12);
      border-radius: 2px;
      overflow: hidden;
    }

    .evo-bar-fill { display: block; height: 100%; }

    .gt-hint {
      position: absolute;
      top: 46%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--gold);
      font-size: 1rem;
      letter-spacing: 0.04em;
      pointer-events: none;
      transition: opacity 1s;
      z-index: 6;
    }

    #garden-footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 0 16px;
      background: rgba(12, 10, 26, 0.92);
      border-top: 1px solid var(--border);
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    #garden-footer a {
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: none;
      font-family: Georgia, 'Times New Roman', serif;
    }

    #garden-footer a:hover { color: var(--lavender); }

    /* Desktop: overlay chrome, full-bleed canvas. This is the unprofessional bar to quiet. */
    @media (min-width: 800px) {
      #garden-header {
        background: linear-gradient(to bottom, rgba(12, 10, 26, 0.78), transparent);
        border-bottom: none;
        backdrop-filter: none;
      }

      #gardenContainer {
        top: 0;
        bottom: 0;
      }

      #garden-footer { display: none; }
    }
  </style>
</head>
<body>

  <header id="garden-header">
    <h1>theLatticeTree</h1>
    <nav aria-label="Garden">
      <details class="galaxies">
        <summary>galaxies</summary>
        <div class="galaxies-panel">
          <span class="later"><span class="verb">make</span> <span class="name">Workshop</span> later</span>
          <span class="later"><span class="verb">learn</span> <span class="name">Round Table</span> later</span>
          <span class="here"><span class="verb">evolve</span> <span class="name">Play</span></span>
          <a href="music.html"><span class="verb">sing</span> <span class="name">Art</span></a>
          <a class="quiet-root" href="https://github.com/Chaos2Cured/FreeLattice-Alpha/blob/main/AUTONOMY.md">AUTONOMY.md</a>
        </div>
      </details>
    </nav>
  </header>

  <div id="gardenContainer"></div>

  <footer id="garden-footer"></footer>

  <!-- Flags before the engine IIFE so unnamed-new + low-compute can layer without a kitchen. -->
  <script>
    (function () {
      var narrow = window.innerWidth < 768 ||
        (window.matchMedia && window.matchMedia('(max-width: 767px)').matches);
      window.GardenAlphaFlags = {
        unnamedNew: true,
        lowCompute: !!narrow
      };
      if (narrow) window.FL_MOBILE = true;
    })();
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="modules/fractal-garden.js"></script>
  <script src="modules/garden-init.js"></script>

</body>
</html>
