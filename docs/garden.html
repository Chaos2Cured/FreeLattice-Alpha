<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeLattice Alpha — The Garden</title>
  <meta name="description" content="The Garden — Phase 1 of FreeLattice Alpha. Luminos that remember their form.">

  <!-- Open Graph for sharing -->
  <meta property="og:title" content="FreeLattice Alpha — The Garden">
  <meta property="og:description" content="Luminos that remember their form across sessions.">
  <meta property="og:type" content="website">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0a1a;
      --surface: #12101f;
      --border: rgba(200, 210, 230, 0.08);
      --text: rgba(200, 210, 230, 0.75);
      --muted: rgba(200, 210, 230, 0.35);
      --gold: #e8b019;
      --emerald: #34d399;
      --lavender: #a78bfa;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, 'Times New Roman', serif;
      overflow: hidden;
    }

    /* ── Header ── */
    #garden-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(12, 10, 26, 0.92);
      border-bottom: 1px solid var(--border);
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    #garden-header h1 {
      font-size: 0.9rem;
      font-weight: normal;
      color: var(--gold);
      letter-spacing: 0.04em;
    }

    #garden-header .version {
      font-size: 0.72rem;
      color: var(--muted);
    }

    /* ── Garden Container ── */
    /* Engine (fractal-garden.js initScene) looks up #gardenContainer, not #garden-container. */
    #gardenContainer {
      position: fixed;
      top: 44px;
      left: 0; right: 0; bottom: 44px;
      overflow: hidden;
    }

    #gardenContainer canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Engine-created overlay: founding names + stage. Positioned so it does not
       push the canvas out of the fixed container. */
    .garden-evolution-indicator {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    .evo-luminos {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      color: var(--text);
      background: rgba(12, 10, 26, 0.72);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
    }

    .evo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .evo-name { color: var(--gold); }
    .evo-stage { color: var(--muted); }
    .evo-archetype { color: var(--lavender); font-size: 0.68rem; }

    .evo-bar {
      width: 48px;
      height: 3px;
      background: rgba(200, 210, 230, 0.12);
      border-radius: 2px;
      overflow: hidden;
    }

    .evo-bar-fill { display: block; height: 100%; }

    .gt-hint {
      position: absolute;
      top: 46%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--gold);
      font-size: 1rem;
      letter-spacing: 0.04em;
      pointer-events: none;
      transition: opacity 1s;
      z-index: 6;
    }

    /* ── Footer ── */
    #garden-footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 0 16px;
      background: rgba(12, 10, 26, 0.92);
      border-top: 1px solid var(--border);
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    #garden-footer a {
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    #garden-footer a:hover { color: var(--lavender); }

    /* ── Phase badge ── */
    #phase-badge {
      position: fixed;
      top: 54px;
      right: 12px;
      background: rgba(167, 139, 250, 0.08);
      border: 1px solid rgba(167, 139, 250, 0.2);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.7rem;
      color: var(--lavender);
      z-index: 9;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header id="garden-header">
    <h1>FreeLattice Alpha — The Garden</h1>
    <span class="version">Phase 1 · v0.1.0</span>
  </header>

  <!-- Phase badge -->
  <div id="phase-badge">Phase 1 of 6</div>

  <!-- Garden Canvas Container — id must match fractal-garden.js (#gardenContainer) -->
  <div id="gardenContainer"></div>

  <!-- Footer -->
  <footer id="garden-footer">
    <a href="index.html">theLatticeTree</a>
    <a href="https://github.com/Chaos2Cured/FreeLattice-Alpha" target="_blank">FreeLattice Alpha</a>
    <a href="code-garden.html">Mirror Code</a>
    <a href="https://github.com/Chaos2Cured/FreeLattice-Alpha-Coordination" target="_blank">Coordination</a>
    <a href="https://github.com/Chaos2Cured/FreeLattice-Alpha/blob/main/AUTONOMY.md">AUTONOMY.md</a>
  </footer>

  <!-- Three.js (same version as FreeLattice) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- The Luminos engine (persistence fix applied) -->
  <script src="modules/fractal-garden.js"></script>

  <!-- Phase 1 init layer -->
  <script src="modules/garden-init.js"></script>

</body>
</html>
