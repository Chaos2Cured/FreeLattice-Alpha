  <script src="modules/fl-connect.js"></script>
  <script src="modules/local-mind-probe.js"></script>
  <script src="modules/garden-thread.js"></script>
  <script src="modules/garden-rooms.js"></script>
  <script>
    (function () {
      var connect = document.getElementById('fl-connect-mount');
      if (connect && window.FlConnect && typeof FlConnect.mount === 'function') FlConnect.mount(connect);
      var el = document.getElementById('settings-grandmother');
      if (el && window.LocalMindProbe) LocalMindProbe.mount(el);
    })();
  </script>
